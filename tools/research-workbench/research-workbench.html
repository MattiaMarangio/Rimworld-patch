<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Research Tree Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a slim top bar (version, scores, view tools), the research canvas as the hero with a one-line legend under it, and a context rail on the right that only shows what is selected, with that context's shortcuts pinned at its foot. Single dark look, like the in-game research window. */
:root{
  color-scheme:dark;
  --ground:#15181c; --panel:#1d2126; --panel-2:#252a31; --line-soft:#343b44; --tray:#191c20; --pop:#22272e;
  --node:#2b3038; --node-mod:#22262b; --node-hi:#39404a; --text:#e3e6ea; --muted:#98a0ab; --faint:#6b7480;
  --accent:#e0b04c; --accent-ink:#1b1608; --ok:#7cc48a; --bad:#e56a5f;
  --link:#7f8894; --link-hi:#f1d27f; --link-dep:#8fc2f0; --hidden-link:#8f7cc0;
  --core:#56606c; --royalty:#e8c35a; --ideology:#c79af2; --biotech:#86d07a; --anomaly:#ee7b6e; --odyssey:#6cc8e6; --mod:#8c96a3;
  --th0:#d79ad0; --th1:#9bcf6d; --th2:#6ccab4; --th3:#ec8f8f; --th4:#c39cf0; --th5:#f0c761; --th6:#75b8f2;
  --th7:#d7a071; --th8:#b9b489; --th9:#f09dc0; --th10:#e97a5b; --th11:#8f9cf0; --th12:#8ad6d8; --th13:#b6c2d4;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --f-ui:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--f-ui);font-size:15px;margin:0;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-inline:16px;padding-block:10px 12px;box-sizing:border-box;gap:10px}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.01em;white-space:nowrap}
.vername{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line-soft);padding:3px 9px;font-weight:600}
.vername .caret{color:var(--muted);font-size:11px}
.vername .ed{color:var(--accent);font-weight:500}
.savestate{font-size:12.5px;color:var(--faint);white-space:nowrap}
.savestate.bad{color:var(--bad)}
.metrics{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line-soft);border-radius:4px;padding:3px 9px;font-size:13px;color:var(--muted);font-weight:500;font-family:var(--f-ui)}
.chip b{font-family:var(--f-num);font-weight:500;color:var(--text);font-size:13px}
.chip .d{font-family:var(--f-num);font-size:12px}
.d.better{color:var(--ok)} .d.worse{color:var(--bad)}
button.chip{cursor:pointer}
button.chip.alert{border-color:var(--bad)} button.chip.alert b{color:var(--bad)}
button.chip.has{border-color:var(--accent)} button.chip.has b{color:var(--accent)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.group{display:flex;border:1px solid var(--line-soft);border-radius:4px;overflow:hidden}
.group button{border:0;border-radius:0;border-right:1px solid var(--line-soft)}
.group button:last-child{border-right:0}
.group .zl{font-family:var(--f-num);font-size:12px;min-width:46px}

button{font-family:var(--f-ui);font-size:14px;font-weight:600;background:var(--panel-2);color:var(--text);border:1px solid var(--line-soft);border-radius:4px;padding:4px 10px;cursor:pointer}
button:hover{background:var(--node-hi)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,.node:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{border-color:var(--bad);color:var(--bad)}
button.ghost{background:none;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--text);background:var(--panel-2)}
button.small{font-size:13px;padding:2px 8px}
input[type=search],input[type=text]{font-family:var(--f-ui);font-size:14px;background:var(--panel);color:var(--text);border:1px solid var(--line-soft);border-radius:4px;padding:4px 9px}
input[type=search]{width:160px}
kbd{font-family:var(--f-num);font-size:11px;background:var(--panel-2);border:1px solid var(--line-soft);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--text);white-space:nowrap}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;min-height:0}
.stagewrap{position:relative;display:grid;grid-template-rows:1fr auto;gap:6px;min-height:0;min-width:0}
.stage{position:relative;background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;overflow:auto;min-height:0;cursor:crosshair}
.sizer{position:relative}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.trayband{fill:var(--tray)}
.edge{stroke:var(--line-soft);stroke-width:2}
.zonelabel{fill:var(--muted);font-family:var(--f-ui);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.guide.centre{stroke:var(--accent);stroke-opacity:.2;stroke-dasharray:6 6;stroke-width:1.5}
.colnum{fill:var(--faint);font-family:var(--f-num);font-size:12px}
.ghost{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
.ghostlabel{fill:var(--accent);font-family:var(--f-ui);font-size:12px}
.lk{stroke:var(--link);stroke-width:1.6;fill:none;stroke-opacity:.8}
.lk.hid{stroke:var(--hidden-link);stroke-dasharray:4 4;stroke-opacity:.75}
.lk.tray{stroke-dasharray:2 5;stroke-opacity:.9}
.lk.add{stroke:var(--ok);stroke-opacity:1;stroke-width:2.2}
.lk.rm{stroke:var(--bad);stroke-dasharray:7 5;stroke-opacity:.6}
.lk.up{stroke:var(--link-hi);stroke-width:2.6;stroke-opacity:1}
.lk.down{stroke:var(--link-dep);stroke-width:2.6;stroke-opacity:1}
.lk.badlk{stroke:var(--bad);stroke-width:2.4;stroke-opacity:1}
.lk.selk{stroke:var(--accent);stroke-width:3.4;stroke-opacity:1}
.focusing .lk:not(.up):not(.down):not(.selk){stroke-opacity:.12}
.hit{stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
.links.picking .hit{pointer-events:none}

.node{position:absolute;width:140px;height:50px;box-sizing:border-box;background:var(--node);border:1.5px solid var(--src);border-radius:3px;padding:3px 7px 7px;cursor:grab;user-select:none;touch-action:none;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.node::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--th)}
.node[data-src="Core"]{--src:var(--core)}
.node[data-src="Royalty"]{--src:var(--royalty);border-style:dashed}
.node[data-src="Ideology"]{--src:var(--ideology);border-style:dashed}
.node[data-src="Biotech"]{--src:var(--biotech);border-style:dashed}
.node[data-src="Anomaly"]{--src:var(--anomaly);border-style:dashed}
.node[data-src="Odyssey"]{--src:var(--odyssey);border-style:dashed}
.node[data-src="Mod"]{--src:var(--mod);border-style:dotted;background:var(--node-mod)}
.node .nl{font-size:14px;font-weight:600;line-height:1.05;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node.ren .nl{-webkit-line-clamp:1}
.node .no{font-size:11.5px;color:var(--muted);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.node .nc{font-family:var(--f-num);font-size:10.5px;color:var(--muted);line-height:1}
.node .lockico{position:absolute;top:3px;right:4px;width:11px;height:12px;display:none;color:var(--accent)}
.node.locked .lockico{display:block}
.node.locked{cursor:not-allowed}
.node.locked .nl{padding-right:12px}
.node.sel{box-shadow:0 0 0 2px var(--accent)}
.node.prob{box-shadow:0 0 0 2px var(--bad)}
.node.match{box-shadow:0 0 0 3px var(--link-dep)}
.node.dragging{cursor:grabbing;z-index:5;opacity:.92}
.focusing .node:not(.rel){opacity:.28}
.node.rel.upn{box-shadow:0 0 0 2px var(--link-hi)} .node.rel.dnn{box-shadow:0 0 0 2px var(--link-dep)}
.stage.picking,.stage.picking .node{cursor:copy}
.marquee{position:absolute;border:1px dashed var(--accent);background:rgba(224,176,76,.08);pointer-events:none}

.legendbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:13px;color:var(--muted)}
.legendbar .sep{width:1px;height:14px;background:var(--line-soft)}
.lg{display:flex;align-items:center;gap:5px;background:none;border:0;padding:0;font-size:13px;font-weight:500;color:var(--muted)}
button.lg:hover{color:var(--text);background:none}
.sw{width:18px;height:11px;background:var(--node);border:1.5px solid var(--src);box-sizing:border-box;border-radius:2px;flex:none}
.sw.dash{border-style:dashed} .sw.dot{border-style:dotted;background:var(--node-mod)}
.ln{width:18px;height:0;border-top:2px solid var(--c);flex:none}
.ln.dash{border-top-style:dashed}

.toast{position:absolute;left:12px;bottom:40px;max-width:min(460px,calc(100% - 24px));background:var(--pop);border:1px solid var(--line-soft);border-radius:5px;padding:7px 12px;font-size:14px;box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.ok{border-color:var(--ok)} .toast.bad{border-color:var(--bad)}

/* context rail */
aside{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;min-height:0;display:grid;grid-template-rows:1fr auto;overflow:hidden}
.ctx{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0}
.ctx h2{margin:0;font-size:20px;line-height:1.1;text-wrap:balance}
.ctx .was{color:var(--muted);font-style:italic;font-size:14px;margin:2px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13.5px;color:var(--muted)}
.meta .num{font-family:var(--f-num);font-size:12.5px}
.meta .okk{color:var(--ok)} .meta .lockd{color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.sect{display:flex;flex-direction:column;gap:5px}
.conn{display:flex;align-items:center;gap:6px;min-height:26px;border-radius:4px;padding:1px 4px 1px 0}
.conn:hover{background:var(--panel-2)}
.conn .to{flex:1;min-width:0;text-align:left;background:none;border:0;padding:2px 6px;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn .to:hover{background:none;text-decoration:underline}
.conn .to.rm{text-decoration:line-through;color:var(--muted)}
.conn .to.hid{color:var(--muted)}
.st{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.st.add{color:var(--ok)} .st.rm{color:var(--bad)} .st.hid{color:var(--hidden-link)}
.conn .ops{display:flex;gap:3px;opacity:0}
.conn:hover .ops,.conn:focus-within .ops,.conn.always .ops{opacity:1}
button.mini{font-size:12px;font-weight:600;padding:0 6px;line-height:1.6}
.empty{color:var(--faint);font-size:14px}
details.unl summary{cursor:pointer;color:var(--muted);font-size:14px}
details.unl p{font-size:13px;color:var(--muted);line-height:1.4;margin:6px 0 0}
.card{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:5px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.card.warn{border-color:var(--bad)}
.card p{margin:0;color:var(--muted);line-height:1.4}
.card b{color:var(--text)}
.pickcard{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:10px 12px;font-weight:600;display:flex;flex-direction:column;gap:8px}
.pickcard button{align-self:flex-start;background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.keys{border-top:1px solid var(--line-soft);padding:10px 14px 12px;display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;font-size:13px;color:var(--muted);background:var(--ground)}
.keys .kk{display:flex;gap:3px;justify-content:flex-end}
.keys .mouse{font-size:12px;color:var(--muted);font-style:italic;white-space:nowrap}
.keys .kt{font-family:var(--f-ui);font-size:12px;color:var(--text);white-space:nowrap}

/* popovers */
.pop{position:fixed;z-index:50;width:min(360px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;background:var(--pop);border:1px solid var(--line-soft);border-radius:6px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.pop h3{margin:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.savever{display:flex;gap:6px}
.savever input{flex:1;min-width:0}
.versions{display:flex;flex-direction:column;gap:6px}
.ver{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:4px;padding:7px 9px}
.ver.open{border-color:var(--accent)}
.ver .vn{font-weight:600;font-size:15px;min-width:0;overflow-wrap:anywhere}
.ver .vm{grid-column:1;font-size:12px;color:var(--muted);font-family:var(--f-num)}
.ver .va{grid-column:2;grid-row:1 / span 2;display:flex;gap:4px}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:6px}
.plist{display:flex;flex-direction:column;gap:4px}
.plist button{text-align:left;font-weight:500;font-size:13.5px}
.plist button.bad{border-color:var(--bad)}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:13px;font-weight:500;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:3px;padding:1px 6px;cursor:pointer;color:var(--text)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.themes button{display:flex;align-items:center;gap:6px;background:none;border:0;padding:1px 0;font-weight:500;font-size:13px;color:var(--text);text-align:left}
.themes i{width:10px;height:10px;border-radius:2px;flex:none;background:var(--th)}
label.tog{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}

@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .stage{height:65vh}
  aside{max-height:none}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Research Tree Workbench</h1>
      <button class="vername" id="verBtn" aria-haspopup="dialog" aria-expanded="false" title="Versions"><span id="verName"></span><span class="caret">▾</span></button>
      <span class="savestate" id="saveState"></span>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="tools">
      <input type="search" id="search" placeholder="Find a project  /" aria-label="Find a project">
      <div class="group" role="group" aria-label="Zoom">
        <button id="zOut" title="Zoom out (−)" aria-label="Zoom out">−</button>
        <button id="zFit" class="zl" title="Fit the tree to the window (0)">Fit</button>
        <button id="zIn" title="Zoom in (+)" aria-label="Zoom in">+</button>
      </div>
      <button id="viewBtn" aria-haspopup="dialog" aria-expanded="false">View ▾</button>
      <div class="group" role="group" aria-label="History">
        <button id="undo" disabled title="Undo (⌘Z)">Undo</button>
        <button id="redo" disabled title="Redo (⇧⌘Z)">Redo</button>
      </div>
    </div>
  </header>
  <div class="main">
    <div class="stagewrap">
      <div class="stage" id="stage" tabindex="-1">
        <div class="sizer" id="sizer">
          <div class="world" id="world">
            <svg class="links" id="links"></svg>
          </div>
        </div>
      </div>
      <div class="legendbar" id="legendbar"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <aside aria-label="Selection">
      <div class="ctx" id="ctx"></div>
      <div class="keys" id="keys" aria-label="Shortcuts"></div>
    </aside>
  </div>
</div>

<div class="pop" id="popVersions" role="dialog" aria-label="Versions" hidden>
  <h3>Save this layout</h3>
  <div class="savever">
    <input type="text" id="verInput" placeholder="Name this version" aria-label="Version name" maxlength="60">
    <button class="primary" id="saveVer">Save</button>
  </div>
  <h3>Open a version</h3>
  <div class="versions" id="versions"></div>
</div>
<div class="pop" id="popProblems" role="dialog" aria-label="Problems" hidden>
  <h3>Problems</h3>
  <div class="plist" id="probList"></div>
</div>
<div class="pop" id="popChanges" role="dialog" aria-label="Changes" hidden>
  <h3>Connections</h3>
  <div class="plist" id="lkList"></div>
  <h3 id="movedHead">Moved</h3>
  <div class="pills" id="movedList"></div>
</div>
<div class="pop" id="popView" role="dialog" aria-label="View" hidden>
  <label class="tog"><input type="checkbox" id="showHidden"> Show hidden requirements</label>
  <h3>Bottom stripe: theme</h3>
  <div class="themes" id="themes"></div>
  <h3>Hand-off</h3>
  <button id="copy" class="small" title="Copies every position and connection change as text">Copy layout as text</button>
</div>

const isAdded=k=>!ORIGV.has(k)&&!ORIGH.has(k);
function setLink(k,action){
  const before=snapshot(), added=isAdded(k);
  if(action==='restore'){ delete links[k] }
  else if(action==='remove'){ if(added) delete links[k]; else links[k]='remove' }
  else if(action==='hide'){ if(added) links[k]='addHidden'; else if(ORIGH.has(k)) delete links[k]; else links[k]='hide' }
  else if(action==='show'){ if(added) links[k]='add'; else if(ORIGV.has(k)) delete links[k]; else links[k]='show' }
  commit(before);
  const [q,d]=unK(k);
  toast(`${{remove:added?'Deleted':'Removed',hide:'Hidden',show:'Shown',restore:'Restored'}[action]}: ${L(q)} → ${L(d)}`,'ok');
}
function wouldCycle(q,d){
  const par={}; [...EFF.vis,...EFF.hid].forEach(([a,b])=>(par[b]??=[]).push(a));
  const seen=new Set(), st=[q];
  while(st.length){ const x=st.pop(); if(x===d) return true; if(seen.has(x))continue; seen.add(x); (par[x]||[]).forEach(p=>st.push(p)) }
  return false;
}
function addLink(q,d){
  if(q===d){ toast('A project cannot need itself.','bad'); return }
  const k=K(q,d), s=linkState(k);
  if(s==='visible'||s==='hidden'){ toast(`${L(d)} already needs ${L(q)}.`,'bad'); return }
  if(wouldCycle(q,d)){ toast(`Not possible: ${L(q)} already depends on ${L(d)}, so this would make a loop.`,'bad'); return }
  const before=snapshot();
  if(s==='removed') delete links[k]; else links[k]='add';
  commit(before); toast(`Added: ${L(d)} now needs ${L(q)}`,'ok');
}

/* ---------- starting layouts ---------- */
function packTray(p,ids){
  const taken=new Set(Object.entries(p).filter(([i,v])=>v&&v[1]>MAXY).map(([i,v])=>v[0]+':'+r1(v[1])));
  ids=[...ids].sort((a,b)=>byId[a].th-byId[b].th||byId[a].c-byId[b].c);
  let k=0;
  ids.forEach(id=>{ let x,y; do{ x=k%TRAYW; y=r1(TRAY+Math.floor(k/TRAYW)*0.6); k++ }while(taken.has(x+':'+y)); p[id]=[x,y]; taken.add(x+':'+y) });
  return p;
}
function vanillaLayout(){ const p={}; nodes.forEach(n=>{ if(n.v) p[n.id]=[...n.v] }); return packTray(p,nodes.filter(n=>!n.v).map(n=>n.id)) }
function modLayout(){ const p={}; nodes.forEach(n=>p[n.id]=[n.x,n.y]); return p }
function complete(p){ const q={}; const miss=[]; nodes.forEach(n=>{ if(Array.isArray(p?.[n.id])) q[n.id]=[+p[n.id][0],+p[n.id][1]]; else miss.push(n.id) }); return miss.length? packTray(q,miss):q }
const cleanLocks=a=>new Set((Array.isArray(a)?a:[]).filter(i=>byId[i]));
const cleanLinks=l=>{ const o={}; Object.entries(l||{}).forEach(([k,v])=>{ const [q,d]=unK(k); if(byId[q]&&byId[d]&&['remove','hide','show','add','addHidden'].includes(v)) o[k]=v }); return o };

const X=x=>PAD+x*UX, Y=y=>TOP+y*UY;
const worldW=()=>PAD*2+COLS*UX, worldH=()=>TOP+TRAYMAX*UY+NH+PAD;
function place(){

function drawLinks(){
  const W=worldW(); let g='';
  const gameBottom=Y(MAXY)+NH+14, trayTop=Y(TRAY)-30;
  g+=`<rect class="trayband" x="0" y="${gameBottom+8}" width="${W}" height="${worldH()-gameBottom-8}"/>`;
  g+=`<line class="edge" x1="0" x2="${W}" y1="${gameBottom}" y2="${gameBottom}"/>`;
  g+=`<text class="zonelabel" x="${PAD}" y="${trayTop}">Not placed yet · drag these up into the tree</text>`;
  for(let c=0;c<COLS;c++) g+=`<text class="colnum" x="${X(c)+NW/2}" y="16" text-anchor="middle">${c}</text>`;
  const cy=Y(CENTRE)+NH/2; g+=`<line class="guide centre" x1="0" x2="${W}" y1="${cy}" y2="${cy}"/>`;
  const gid=hoverId||(sel.size===1?[...sel][0]:null);
  if(gid&&byId[gid].v&&!same(pos[gid],byId[gid].v)){ const [vx,vy]=byId[gid].v; g+=`<rect class="ghost" x="${X(vx)}" y="${Y(vy)}" width="${NW}" height="${NH}" rx="3"/><text class="ghostlabel" x="${X(vx)+4}" y="${Y(vy)-5}">vanilla spot</text>` }
  const bad=new Set(problems().filter(p=>p.kind==='order').map(p=>K(p.q,p.d)));
  let hits='';
  const draw=(list,kind)=>list.forEach(([q,d])=>{
    const k=K(q,d), inTray=!placed(q)||!placed(d), rel=hoverId&&(d===hoverId||q===hoverId);
    if(inTray&&!rel&&selLink!==k) return;
    const a=pos[q], b=pos[d];

    if(bad.has(k)&&kind!=='rm') cls+=' badlk';
    if(hoverId&&kind!=='rm'){ if(d===hoverId) cls+=' up'; else if(q===hoverId) cls+=' down' }
    if(selLink===k) cls+=' selk';
    const c=`x1="${X(a[0])+NW}" y1="${Y(a[1])+NH/2}" x2="${X(b[0])}" y2="${Y(b[1])+NH/2}"`;
    g+=`<line class="${cls}" ${c}/>`; hits+=`<line class="hit" data-k="${esc(k)}" ${c}/>`;
  });
  draw(EFF.rem,'rm');
  draw(showHidden?EFF.hid:EFF.hid.filter(([q,d])=>K(q,d)===selLink),'hid');
  draw(EFF.vis,'vis');
  svg.innerHTML=g+hits;
}

/* ---------- metrics & problems ---------- */
function orient(ax,ay,bx,by,cx,cy){const v=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax);return v>1e-9?1:v<-1e-9?-1:0}
function crosses(s,t){
  if(Math.max(s.x1,s.x2)<=Math.min(t.x1,t.x2)||Math.max(t.x1,t.x2)<=Math.min(s.x1,s.x2))return false;
  return orient(s.x1,s.y1,s.x2,s.y2,t.x1,t.y1)*orient(s.x1,s.y1,s.x2,s.y2,t.x2,t.y2)<0 && orient(t.x1,t.y1,t.x2,t.y2,s.x1,s.y1)*orient(t.x1,t.y1,t.x2,t.y2,s.x2,s.y2)<0;
}
function metricsFor(p,vis){
  const on=id=>p[id][1]<=MAXY+1e-6;
  const S=vis.filter(([q,d])=>on(q)&&on(d)).map(([q,d])=>({q,d,x1:p[q][0]+NW/UX,y1:p[q][1],x2:p[d][0],y2:p[d][1]}));
  const P=nodes.filter(n=>on(n.id)); let cr=0, box=0;
  for(let i=0;i<S.length;i++){
    const s=S[i];
    for(let j=i+1;j<S.length;j++){const t=S[j]; if(s.q===t.q||s.q===t.d||s.d===t.q||s.d===t.d)continue; if(crosses(s,t))cr++}
    if(s.x2<=s.x1) continue;
    for(const n of P){ if(n.id===s.q||n.id===s.d)continue; const [nx,ny]=p[n.id];
      const bx1=nx+NW/UX; if(s.x2<=nx||s.x1>=bx1)continue;
      for(const t of [nx,nx+NW/UX/2,bx1]){ if(t<s.x1||t>s.x2)continue; const yy=s.y1+(s.y2-s.y1)*(t-s.x1)/(s.x2-s.x1); if(Math.abs(yy-ny)<(NH/UY)/2+0.03){box++;break} } }
  }
  const offV=nodes.filter(n=>n.v&&!same(p[n.id],n.v)).length;
  return {cr,box,unplaced:nodes.length-P.length,offV};
}
function problems(){
  const out=[], ids=nodes.map(n=>n.id).sort((a,b)=>pos[a][0]-pos[b][0]);
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
    const a=pos[ids[i]], b=pos[ids[j]]; if(b[0]-a[0]>=NW/UX) break;
    if(Math.abs(a[1]-b[1])<0.55) out.push({kind:'overlap',a:ids[i],b:ids[j]});
  }
  [...EFF.vis.map(e=>[...e,false]),...EFF.hid.map(e=>[...e,true])].forEach(([q,d,h])=>{
    if(placed(q)&&placed(d)&&pos[q][0]>=pos[d][0]) out.push({kind:'order',q,d,h}) });
  return out;
}

function selectLink(k,scroll){

/* ---------- history ---------- */

/* ---------- pointer ---------- */
let drag=null, lastPt=null, autoRAF=null;
function toWorld(pt){const r=world.getBoundingClientRect();return {x:(pt.clientX-r.left)/zoom,y:(pt.clientY-r.top)/zoom}}
function settleY(y){ if(y>MAXY+1e-6&&y<TRAY-1e-6) return (y-MAXY<TRAY-y)?MAXY:TRAY; return y }
world.addEventListener('pointerdown',ev=>{
  if(ev.button!==0)return;
  const nodeEl=ev.target.closest('.node'), hit=ev.target.closest('.hit'), p=toWorld(ev);
  if(pick){
    if(nodeEl){ const other=nodeEl.dataset.id, {id,dir}=pick; pick=null; stage.classList.remove('picking'); svg.classList.remove('picking'); dir==='req'?addLink(other,id):addLink(id,other); selectOnly([id]) }
    ev.preventDefault(); return;
  }
  if(hit&&!nodeEl){ selectLink(hit.dataset.k); ev.preventDefault(); return }
  if(nodeEl){

    paintSel(); renderCtx(); drawLinks();
    const movable=[...sel].filter(i=>!locks.has(i));
    if(!movable.length){ if(locks.has(id)) toast(`${L(id)} is locked. Press L to unlock it.`); ev.preventDefault(); return }
    drag={kind:'move',start:p,ids:movable,from:Object.fromEntries(movable.map(i=>[i,[...pos[i]]])),before:snapshot(),moved:false};
    nodeEl.setPointerCapture(ev.pointerId);
  } else {

    const m=document.createElement('div'); m.className='marquee'; world.appendChild(m);

  }

});
world.addEventListener('pointermove',ev=>{
  if(!drag){ const n=ev.target.closest('.node'); setHover(n?n.dataset.id:null); return }
  lastPt={clientX:ev.clientX,clientY:ev.clientY}; updateDrag(lastPt);
});
function updateDrag(pt){
  const p=toWorld(pt);
  if(drag.kind==='move'){
    const F=drag.from, ids=drag.ids;
    const minY=Math.min(...ids.map(i=>F[i][1])), maxY=Math.max(...ids.map(i=>F[i][1])), minX=Math.min(...ids.map(i=>F[i][0]));
    let sdy=Math.round((p.y-drag.start.y)/UY/STEP)*STEP; sdy=Math.max(-minY,Math.min(TRAYMAX-maxY,sdy));
    const sdx=Math.max(-minX,Math.round((p.x-drag.start.x)/UX));
    if(!drag.moved&&(sdx||Math.abs(sdy)>1e-6)){ drag.moved=true; ids.forEach(i=>el[i].classList.add('dragging')) }
    ids.forEach(i=>{ pos[i]=[r1(F[i][0]+sdx),r1(settleY(F[i][1]+sdy))]; el[i].style.left=X(pos[i][0])+'px'; el[i].style.top=Y(pos[i][1])+'px' });
    drawLinks();

    const a=drag.start, x0=Math.min(a.x,p.x), y0=Math.min(a.y,p.y), x1=Math.max(a.x,p.x), y1=Math.max(a.y,p.y);

    sel=new Set(drag.add); nodes.forEach(n=>{const nx=X(pos[n.id][0]),ny=Y(pos[n.id][1]); if(nx+NW>x0&&nx<x1&&ny+NH>y0&&ny<y1) sel.add(n.id)}); paintSel();
  }
}
const EDGE=56, SPEED=26;
function edgeSpeed(p,lo,hi){ if(p<lo+EDGE) return -SPEED*Math.min(1,(lo+EDGE-p)/EDGE); if(p>hi-EDGE) return SPEED*Math.min(1,(p-(hi-EDGE))/EDGE); return 0 }
function autoScroll(){
  autoRAF=null; if(!drag) return;
  if(lastPt){
    const r=stage.getBoundingClientRect();
    const dx=edgeSpeed(lastPt.clientX,r.left,r.right), dy=edgeSpeed(lastPt.clientY,r.top,r.bottom);
    if(dx||dy){ const bl=stage.scrollLeft, bt=stage.scrollTop; stage.scrollLeft+=dx; stage.scrollTop+=dy; if(stage.scrollLeft!==bl||stage.scrollTop!==bt) updateDrag(lastPt) }
  }

}
function endDrag(){
  if(!drag)return;

  if(drag.kind==='move'){ drag.ids.forEach(i=>el[i].classList.remove('dragging')); if(drag.moved){ commit(drag.before) } }
  else { drag.m.remove(); drawLinks(); renderCtx() }

/* ---------- keyboard ---------- */
document.addEventListener('keydown',ev=>{
  const mod=ev.metaKey||ev.ctrlKey, key=ev.key.toLowerCase();
  if(ev.key==='Escape'){ if(popAnchor){ closePops(); return } if(pick){ cancelPick(); return } if(ev.target.matches('input')){ ev.target.blur(); return } clearSel(); return }
  if(ev.target.matches('input'))return;
  if(mod&&key==='z'){ ev.preventDefault(); ev.shiftKey?redo():undo(); return }
  if(mod) return;
  if(ev.key==='/'){ ev.preventDefault(); $('search').focus(); return }
  if(ev.key==='='||ev.key==='+'){ setZoom(zoom*1.2); return }
  if(ev.key==='-'){ setZoom(zoom/1.2); return }
  if(ev.key==='0'){ zoomFit=true; applyZoom(); return }
  if(selLink){
    if(ev.key==='Delete'||ev.key==='Backspace'){ ev.preventDefault(); setLink(selLink,linkState(selLink)==='removed'?'restore':'remove'); return }
    if(key==='h'){ const s=linkState(selLink); if(s!=='removed') setLink(selLink,s==='hidden'?'show':'hide'); return }
  }
  if(!sel.size) return;
  if(key==='l'){ toggleLock([...sel]); return }
  if(key==='v'){ toVanilla([...sel]); return }
  if(key==='r'&&sel.size===1){ startPick([...sel][0],ev.shiftKey?'lead':'req'); return }
  const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-STEP],ArrowDown:[0,STEP]}[ev.key];
  if(k){
    ev.preventDefault(); const ids=[...sel].filter(i=>!locks.has(i)); if(!ids.length){ toast('Locked projects stay put.'); return }
    if(ids.some(i=>pos[i][0]+k[0]<0||pos[i][1]+k[1]<-1e-6||pos[i][1]+k[1]>TRAYMAX+1e-6)) return;
    const b=snapshot(); ids.forEach(i=>pos[i]=[r1(pos[i][0]+k[0]),r1(settleY(pos[i][1]+k[1]))]); commit(b);
  }
});

/* ---------- versions ---------- */

  base={id:v.id,name:v.name,pos:JSON.parse(JSON.stringify(pos)),links:{...links},locks:[...locks]};
  if(before!==snapshot()){ undoStack.push({state:before,base:prevBase}); redoStack=[] }

    ||JSON.stringify([...locks].sort())!==JSON.stringify([...(base.locks||[])].sort())

const fmtDate=s=>{ try{ return new Date(s).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) }catch(e){ return '' } };

    const nl=Object.keys(v.links||{}).length, nk=(v.locks||[]).length;

/* ---------- autosave & boot ---------- */
let db=null, saveTimer=null, saving=false, dirty=false;
const DRAFT='layouts/current';
function scheduleSave(){ dirty=true; if(!db) return; setSave('Saving…'); clearTimeout(saveTimer); saveTimer=setTimeout(saveDraft,1200) }
async function saveDraft(){
  if(saving||!db||!dirty)return; saving=true; dirty=false;
  const m=metricsFor(pos,EFF.vis);
  const body={pos:JSON.parse(JSON.stringify(pos)),links:{...links},locks:[...locks],base:{id:base.id,name:base.name,pos:base.pos,links:base.links||{},locks:base.locks||[]},savedAt:new Date().toISOString(),unplaced:m.unplaced,cr:m.cr};
  try{ await db.doc(DRAFT).set(body); setSave('Saved') }
  catch(e){ dirty=true; setSave('Not saved, retrying on your next change',true) }
  saving=false; if(dirty) scheduleSave();
}
async function boot(){
  paintLocks(); place(); refreshHeader(); renderCtx(); setSave('Connecting…');
  try{ db = window.claude?.use ? await window.claude.use('db') : null }catch(e){ db=null }
  if(!db){ setSave('Saving unavailable here',true); return }
  db.collection('versions').onSnapshot(s=>{
    versions=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.savedAt||'').localeCompare(a.savedAt||''));
    if(!$('popVersions').hidden) renderVersions();
  },()=>{});
  try{
    const snap=await db.doc(DRAFT).get();
    if(snap.exists){
      const d=snap.data();
      pos=complete(d.pos); links=cleanLinks(d.links); locks=cleanLocks(d.locks);
      base=d.base&&d.base.pos? {id:d.base.id,name:d.base.name,pos:complete(d.base.pos),links:cleanLinks(d.base.links),locks:[...cleanLocks(d.base.locks)]} : {id:'draft',name:'Earlier draft',pos:complete(d.pos),links:{...links},locks:[...locks]};
      EFF=effective(); paintLocks(); place(); refreshHeader(); renderCtx();
      setSave('Saved'); toast(`Picked up where you left off: ${base.name}`,'ok');
    } else { setSave('Saved'); toast('Started from vanilla RimWorld. Your work saves by itself.','ok') }
  }catch(e){ setSave('Could not load your autosave',true) }
}
boot();
</script>
